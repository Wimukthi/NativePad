name: Release Package

env:
  # Pin the official UPX build and verify the archive before it ever touches
  # the release executable. Packing happens before any future code-signing step.
  UPX_VERSION: "5.2.0"
  UPX_SHA256: "b471ebf1b7f20f4a89150264ed9a008a2a5bfd247f3c6d1184a75bb59ca08f5d"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected version already committed in src/NativePad.rc
        required: true
      pack_with_upx:
        description: Pack the release executable with the verified UPX build
        required: false
        default: true
        type: boolean

jobs:
  package:
    name: Package win-x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout NativePad
        uses: actions/checkout@v6
        with:
          path: NativePad

      - name: Checkout Wimukthi.Win32Theme
        uses: actions/checkout@v6
        with:
          repository: Wimukthi/Wimukthi.Win32Theme
          path: Wimukthi.Win32Theme

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Release
        working-directory: NativePad
        # Do not auto-increment here: the release version is the value already
        # committed in src/NativePad.rc, so the packaged build must not bump it.
        run: msbuild NativePad.sln /p:Configuration=Release /p:Platform=x64 /p:AutoIncrementVersion=false /m

      - name: Test Release
        working-directory: NativePad
        run: .\bin\x64\Release\NativePad.Tests.exe

      - name: Resolve Package Version
        id: package-version
        shell: pwsh
        working-directory: NativePad
        run: |
          $version = .\tools\Update-NativePadVersion.ps1 -PrintVersion
          $expected = "${{ inputs.version }}"
          if ($version -ne $expected) {
            throw "Build produced version $version, but workflow input expected $expected."
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download and verify UPX
        if: ${{ inputs.pack_with_upx }}
        shell: pwsh
        run: |
          $archiveName = "upx-$env:UPX_VERSION-win64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $extractPath = Join-Path $env:RUNNER_TEMP "upx-$env:UPX_VERSION"
          $downloadUrl = "https://github.com/upx/upx/releases/download/v$env:UPX_VERSION/$archiveName"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:UPX_SHA256) {
            throw "UPX SHA-256 mismatch. Expected $env:UPX_SHA256, got $actualSha256."
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $upx = Get-ChildItem -LiteralPath $extractPath -Filter "upx.exe" -File -Recurse | Select-Object -First 1
          if (-not $upx) {
            throw "The verified UPX archive did not contain upx.exe."
          }

          & $upx.FullName --version
          if ($LASTEXITCODE -ne 0) {
            throw "The verified UPX binary could not be executed."
          }
          "UPX_PATH=$($upx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Pack Release executable with UPX
        if: ${{ inputs.pack_with_upx }}
        shell: pwsh
        working-directory: NativePad
        run: |
          $exe = (Resolve-Path ".\bin\x64\Release\NativePad.exe").Path
          $before = (Get-Item -LiteralPath $exe).Length

          & $env:UPX_PATH --best --lzma --force --no-color $exe
          if ($LASTEXITCODE -ne 0) {
            throw "UPX failed to pack NativePad.exe."
          }

          & $env:UPX_PATH --test --no-color $exe
          if ($LASTEXITCODE -ne 0) {
            throw "UPX integrity testing failed for NativePad.exe."
          }

          $after = (Get-Item -LiteralPath $exe).Length
          if ($after -ge $before) {
            throw "UPX did not reduce NativePad.exe ($before bytes -> $after bytes)."
          }
          "UPX reduced NativePad.exe from $before bytes to $after bytes." | Out-Host

      - name: Create ZIP
        shell: pwsh
        working-directory: NativePad
        run: |
          $version = $env:PACKAGE_VERSION
          $stage = Join-Path $env:RUNNER_TEMP "NativePad-$version-win-x64"
          $zip = "NativePad-$version-win-x64.zip"

          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -LiteralPath ".\bin\x64\Release\NativePad.exe" -Destination $stage
          Copy-Item -LiteralPath ".\README.md" -Destination $stage
          Copy-Item -LiteralPath ".\LICENSE" -Destination $stage
          Copy-Item -LiteralPath ".\THIRD_PARTY_NOTICES.md" -Destination $stage
          Copy-Item -LiteralPath ".\CHANGELOG.md" -Destination $stage
          Copy-Item -LiteralPath ".\docs" -Destination (Join-Path $stage "docs") -Recurse
          $licenses = New-Item -ItemType Directory -Path (Join-Path $stage "licenses") -Force
          Copy-Item -LiteralPath "..\Wimukthi.Win32Theme\LICENSE" -Destination (Join-Path $licenses "Wimukthi.Win32Theme-MIT.txt")
          Copy-Item -LiteralPath "..\Wimukthi.Win32Theme\third_party\darkmodelib\LICENSE.md" -Destination (Join-Path $licenses "Darkmodelib-MPL-2.0.txt")
          Copy-Item -LiteralPath "..\Wimukthi.Win32Theme\third_party\darkmodelib\LICENSE-MIT.md" -Destination (Join-Path $licenses "Darkmodelib-MIT.txt")
          $source = New-Item -ItemType Directory -Path (Join-Path $licenses "source") -Force
          Copy-Item -LiteralPath "..\Wimukthi.Win32Theme\third_party\darkmodelib" -Destination $source -Recurse

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Create Installer
        shell: pwsh
        working-directory: NativePad
        run: .\installer\build-installer.ps1 -Version "$env:PACKAGE_VERSION" -SkipBuild -SkipTests

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: NativePad-${{ steps.package-version.outputs.version }}-win-x64
          path: NativePad\NativePad-${{ steps.package-version.outputs.version }}-win-x64.zip
          if-no-files-found: error

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          name: NativePad-${{ steps.package-version.outputs.version }}-installer-win-x64
          path: NativePad\installer\output\NativePadSetup-${{ steps.package-version.outputs.version }}-win-x64.exe
          if-no-files-found: error
